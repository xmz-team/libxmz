<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>libxmz File Manager</title>
<style>
  body			{ font-family: -apple-system, monospace; margin: 1em; }
  #path			{ color:#555; margin-bottom:.5em; word-break:break-all; }
  .entry		{ padding:6px 0; border-bottom:1px solid #eee; display:flex; align-items:center; }
  .name			{ flex:1; cursor:pointer; }
  .dir			{ color:#06c; }
  .size			{ color:#999; margin:0 8px; font-size:12px; }
  button		{ padding:4px 8px; margin-left:6px; }
  #editor		{ width:100%; height:45vh; margin-top:1em; font-family:monospace; display:none; }
  #bar button	{ margin-left:0; margin-right:6px; }
</style>
</head>
<body>
  <div id="bar">
	<button onclick="up()">↑ 上级</button>
	<input id="path" style="flex:1;margin:0 6px;font-family:monospace" onkeydown="if(event.key==='Enter')go()">
	<button onclick="newDir()">新建目录</button>
	<button onclick="refresh()">刷新</button>
  </div>
  <div id="path"></div>
  <div id="list"></div>
  <textarea id="editor"></textarea>
  <div>
	<button id="saveBtn" style="display:none" onclick="save()">save</button>
	<button id="closeBtn" style="display:none" onclick="closeEditor()">关闭</button>
  </div>
<script src="app.js"></script>
</body>
</html>
